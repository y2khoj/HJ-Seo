plugins { id 'com.android.application' }
def includePersonal = file('src/personal/java/pro/livemic/studio/CaptureSupport.java').exists()
android {
    namespace 'pro.livemic.studio'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'pro.livemic.studio'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '1.3.0-checkpoint'
        resValue 'string', 'app_name', '라이브볼트'
        testInstrumentationRunner 'pro.livemic.studio.BackgroundRecordingInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2 -fexceptions' } }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'audience'
    productFlavors {
        standard {
            dimension 'audience'
            buildConfigField 'boolean', 'PLAYBACK_CAPTURE', 'false'
        }
        if (includePersonal) { personal {
            dimension 'audience'
            applicationIdSuffix '.personal'
            resValue 'string', 'app_name', '라이브볼트 개인용'
            buildConfigField 'boolean', 'PLAYBACK_CAPTURE', 'true'
        } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
}
