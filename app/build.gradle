plugins { id 'com.android.application' }
android {
    namespace 'pro.livemic.studio'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'pro.livemic.studio'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.1.0-design-v2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2 -fexceptions' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
}
