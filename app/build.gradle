plugins { id 'com.android.application' }
def includePersonal = file('src/personal/java/pro/livemic/studio/CaptureSupport.java').exists()
android {
    namespace 'pro.livemic.studio'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'pro.livemic.studio'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '2.1.0-preview'
        resValue 'string', 'app_name', 'Live Vault'
        testInstrumentationRunner 'pro.livemic.studio.BackgroundRecordingInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2 -fexceptions' } }
    }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2" } }
    buildFeatures { buildConfig true }
    flavorDimensions += 'audience'
    productFlavors {
        standard {
            dimension 'audience'
            buildConfigField 'boolean', 'PLAYBACK_CAPTURE', 'false'
        }
        if (includePersonal) { personal {
            dimension 'audience'
            applicationIdSuffix '.personal'
            resValue 'string', 'app_name', 'Live Vault Personal'
            buildConfigField 'boolean', 'PLAYBACK_CAPTURE', 'true'
        } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
}

dependencies { testImplementation "junit:junit:4.13.2"; testImplementation "org.robolectric:robolectric:4.14.1" }
